# Agent on Fly: one always-on machine, private only (no public URL); the API calls it over Fly's private network.
# Deploy from the repo root:  fly deploy . --config apps/agent/fly.toml --dockerfile apps/agent/Dockerfile
# Secrets (set with `fly secrets set`): AGENT_SERVICE_TOKEN, ANTHROPIC_API_KEY, TAVILY_API_KEY
app = "harrowgate-agent"
primary_region = "lhr"

[env]
  # The API listens on IPv4 only, so the agent reaches it through its public HTTPS address (calls carry the service token).
  API_URL = "https://harrowgate-api.fly.dev"

# No [http_service]: nothing outside the private network can reach the agent, and Fly never stops it.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
