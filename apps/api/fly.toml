# API on Fly: one always-on machine (SQLite and the live-event bus are single-process), public over HTTPS.
# Deploy from apps/api:  fly deploy
# Secrets (set with `fly secrets set`): AGENT_SERVICE_TOKEN, CORS_ORIGINS, ADMIN_PASSWORD, GUEST_PASSWORD, AUTH_SECRET
app = "harrowgate-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # The agent is private; Fly's internal DNS reaches it over the private network.
  AGENT_URL = "http://harrowgate-agent.internal:4111"
  # Refuse to start without ADMIN_PASSWORD and AUTH_SECRET, so production can never run open by mistake.
  AUTH_REQUIRED = "true"

[mounts]
  source = "harrowgate_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
